[package]
name = "s-tools"
version = "1.0.20"
description = "S-Tools cross-platform translation and screenshot utility"
authors = ["ShakePeng"]
edition = "2021"

[lib]
name = "s_tools_lib"
crate-type = ["lib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
image = { version = "0.25", features = ["png", "jpeg"] }
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "sync", "time", "fs", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
xcap = "0.9.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
